    "title": "Publish complete exports with exclusive destination creation",
    "date": "2026-10-24",
    "status": "Accepted",
    "context": "A preexisting-path check alone races another creator. Stage complete bytes beside the destination, publish using an exclusive local rename, and retain device/inode identity for rollback. Unsupported filesystems fail without replacing an existing file. File-group publication is not crash-atomic across multiple paths.",
