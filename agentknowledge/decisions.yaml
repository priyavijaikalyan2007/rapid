    "title": "Constrain Prepare generation to reviewed coaching choices",
    "date": "2026-10-25",
    "status": "Superseded",
    "context": "Actual synthetic model evaluations exposed raw profile names and attack text in free-form output. Keep Watch For tied to the user's selected profile priorities. Generate the other four sections as closed enum choices and map them to reviewed phrases. Validate the final domain object independently and render plain text. This prevents arbitrary generated strings, inferred traits, business plans, or tool instructions from becoming preparation content. Injection may still steer selection among reviewed choices, so guidance suitability remains a review gate. Five actual injection regressions and 20 synthetic context scenarios passed after the change. Superseded after owner feedback and paired tests showed insufficient relevance and role specificity. The retired phrase files remain available in commit 7c9a12e.",
