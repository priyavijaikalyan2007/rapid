    "title": "Bound external inputs before native decoding and cache publication",
    "date": "2026-10-24",
    "status": "Accepted",
    "context": "The source audit found unbounded buffered downloads and decoder inputs. Stream optional HTTPS resources with byte caps, reject insecure redirects and credential URLs, bound catalog metadata and concurrency, and inspect image dimensions before decompression. Keep photos local. Receive picker files and validate metadata before reading bounded chunks, rather than requesting an unbounded Data transfer.",
