# Created: 2026
# COMPONENT: Source validation and development packaging
# PURPOSE: Reject convention and regression failures before producing unsigned development artifacts.
# RELATES: scripts/check-source-style.sh, src/web/eslint.config.mjs, test.sh
# FLOW: Explicit tool installation -> style checks -> repository tests -> native and website builds.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    # Composure's package tests require a macOS 26 host, matching the application baseline.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository validation tools
        run: brew install bats-core shellcheck shfmt

      - name: Install pinned SwiftFormat
        run: |
          curl -fsSL https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.1/swiftformat.zip \
            -o "$RUNNER_TEMP/swiftformat.zip"
          printf '%s  %s\n' \
            '0e5762a848d738602c7a983b26812031e634d85e357db070968b9c805f253eff' \
            "$RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          mkdir -p local/tools/swiftformat
          ditto -x -k "$RUNNER_TEMP/swiftformat.zip" local/tools/swiftformat
          chmod +x local/tools/swiftformat/swiftformat
          local/tools/swiftformat/swiftformat --version

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Install locked website tools
        run: npm ci --prefix src/web --ignore-scripts

      - name: Check source conventions
        run: |
          ./scripts/check-source-style.sh
          npm run lint --prefix src/web

      - name: Validate repository instructions and tools
        run: ./test.sh repository

      - name: Build and test all applications
        run: ./build.sh

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: CropPrint-unsigned
          path: src/cropprint/build/CropPrint-unsigned.zip
