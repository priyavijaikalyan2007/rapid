name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository test runner
        run: brew install bats-core

      - name: Validate repository instructions and tools
        run: ./test.sh repository

      - name: Build and test all applications
        run: ./build.sh

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: CropPrint-unsigned
          path: src/cropprint/build/CropPrint-unsigned.zip
