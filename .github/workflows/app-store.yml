name: Publish CropPrint to App Store Connect

on:
  push:
    branches: [main]
    paths:
      - src/cropprint/VERSION
      - src/cropprint/CropPrint/**
      - src/cropprint/CropPrintMobile/**
      - src/cropprint/Shared/**
      - src/cropprint/CropPrint.xcodeproj/**
      - .github/workflows/app-store.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Archive and upload both applications
        required: true
        default: false
        type: boolean

jobs:
  publish:
    runs-on: macos-15
    defaults:
      run:
        working-directory: src/cropprint
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      CONFIRM_APP_STORE_UPLOAD: YES
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: publishing
        env:
          AUTO_PUBLISH_ENABLED: ${{ vars.ENABLE_APP_STORE_PUBLISH }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          publish=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_PUBLISH" == "true" ]]; then
              publish=true
            fi
          elif [[ "$AUTO_PUBLISH_ENABLED" == "true" ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              publish=true
            elif ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
              src/cropprint/VERSION \
              src/cropprint/CropPrint \
              src/cropprint/CropPrintMobile \
              src/cropprint/Shared \
              src/cropprint/CropPrint.xcodeproj; then
              publish=true
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        if: steps.publishing.outputs.publish == 'true'
        env:
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Test CropPrint
        run: ./build.sh test

      - name: Archive and upload CropPrint
        if: steps.publishing.outputs.publish == 'true'
        run: ./scripts/publish-app-store.sh all
