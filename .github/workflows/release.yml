name: Signed release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: src/cropprint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build information
        run: |
          source ../../config/apple-developer.env
          source ./scripts/build-metadata.sh
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "GIT_SHA=$GIT_SHA" >> "$GITHUB_ENV"

      - name: Install Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/cropprint.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Archive and export
        run: |
          xcodebuild archive \
            -project CropPrint.xcodeproj \
            -scheme CropPrint \
            -configuration Release \
            -archivePath build/CropPrint.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            GIT_SHA="$GIT_SHA"
          xcodebuild -exportArchive \
            -archivePath build/CropPrint.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Notarize and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/export/CropPrint.app build/CropPrint-notarization.zip
          xcrun notarytool submit build/CropPrint-notarization.zip \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple build/export/CropPrint.app
          ditto -c -k --keepParent build/export/CropPrint.app build/CropPrint.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: src/cropprint/build/CropPrint.zip
