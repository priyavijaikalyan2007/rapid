<!doctype html>
<!-- Custom not-found page for the Outcrop Inc website. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | {{organizationName}}</title>
  <link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml">
  <script src="/js/theme-init.js"></script>
  {{analyticsTag}}
  <link rel="stylesheet" href="{{themeBaseUrl}}/icons/bootstrap-icons.css">
  <link rel="stylesheet" href="{{themeBaseUrl}}/css/custom.css">
  <link rel="stylesheet" href="{{themeBaseUrl}}/components/themetoggle/themetoggle.css">
  <link rel="stylesheet" href="{{themeBaseUrl}}/components/sitefooter/sitefooter.css">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="container site-nav" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="{{organizationName}} home">
        <img src="/assets/brand-mark.svg" alt="" width="32" height="32">
        <span>{{organizationName}}</span>
      </a>
      <div class="theme-control"><div id="theme-toggle"></div></div>
    </nav>
  </header>
  <main id="main-content" class="not-found container">
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p>The address does not match a page on this website.</p>
    <a class="btn btn-primary" href="/">Return to the home page</a>
  </main>
  {{siteFooter}}
  <script src="{{themeBaseUrl}}/components/themetoggle/themetoggle.js" defer></script>
  <script src="/js/theme-toggle-init.js" defer></script>
</body>
</html>
